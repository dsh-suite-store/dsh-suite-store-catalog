name: decay

# Daily check that published members still exist.
#
# Runs in this repository rather than a separate one because the job reads
# suites/, writes suites/, and commits — three things that all want the
# caller's own token and checkout. A separate repo would need a PAT with write
# access here for no benefit.
#
# The output is a REPORT, not an edit: a package that vanished from npm is a
# fact a maintainer should see, and silently deleting the member would hide
# that the bundle is now broken.

on:
  schedule:
    # 03:17 UTC — off the hour on purpose. GitHub's scheduler is busiest at
    # :00 and delays any job queued there.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  decay:
    runs-on: ubuntu-latest
    # A hung registry probe must not hold the runner for the default 6 hours;
    # a stuck daily run would still be going when the next one starts.
    timeout-minutes: 15
    # One run at a time: a manual dispatch must not race the scheduled one and
    # file a second tracking issue.
    concurrency:
      group: decay
      cancel-in-progress: false
    steps:
      # `persist-credentials: false`: this job can create issues, so the token
      # carried in `.git/config` is a write credential. The scan only reads
      # files; nothing here pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to a mutable major tag, unlike the first-party `actions/*` steps.
      # Replace with a full commit SHA (`pnpm/action-setup@<sha> # v4`) — the
      # token here can create issues, so a moved tag is a real supply-chain risk.
      # Not done yet only because no network was available to resolve the SHA.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts`: this job holds `issues: write`, and a malicious
      # postinstall (in the lockfile, or added by a merged PR) could read the
      # token from `.git/config` or write `BASH_ENV` into the next step. Nothing
      # in this repository needs an install hook.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Scan for decayed members
        id: scan
        env:
          # The GitHub API allows 60 anonymous requests per hour per IP; one
          # runner probing every git-only member exhausts that and every further
          # answer looks like a missing repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/decay.mjs > decay-report.md

      - name: Ensure the tracking label exists
        uses: actions/github-script@v7
        with:
          script: |
            // The REST API silently drops a label that does not exist, so the
            // issue below would be filed unlabelled and every later run would
            // fail to find it — a new "Decay report" issue every day.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: 'decay' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo, name: 'decay', color: 'ededed',
                description: 'Member decay reports',
              });
            }

      - name: Open or update the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('decay-report.md', 'utf8');
            const title = 'Decay report';
            // Paginated: `per_page: 10` was read as the whole result set, so the
            // real tracking issue fell off page 1 once a few labelled issues
            // were open and the job filed a duplicate.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'decay', per_page: 100,
            });
            const issue = issues.find((entry) => entry.title === title);
            if (issue === undefined) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['decay'] });
            } else {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            }
